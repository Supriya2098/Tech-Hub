name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: 'postgresql://test:test@localhost:5432/techhub_ci?schema=public'
  DIRECT_URL: 'postgresql://test:test@localhost:5432/techhub_ci?schema=public'
  JWT_ACCESS_SECRET: 'ci-access-secret-not-for-production-use-only'
  JWT_REFRESH_SECRET: 'ci-refresh-secret-not-for-production-use-only'

jobs:
  ci:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
